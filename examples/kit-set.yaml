# syntax=docker/sandbox-kit:3
# A kit set bundles published kits into one kit your team can run.
# Replace NAMESPACE with your Docker Hub name. Each ref must be a published
# registry reference: local paths and Git URLs are not accepted in a set.
schemaVersion: "3"
kind: set
displayName: Codex with req-echo
version: "1.0.0"
kits:
  - ref: docker.io/docker/sbx-kit-codex:0.155.1
  - ref: docker.io/NAMESPACE/req-echo:1.0.0
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - packages.company.example:443
